    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Nexa Loops",
      "image": "https://nexaloops.com/logo.png",

      "url": "https://nexaloops.com/",
      "telephone": "+917599993336",

      "areaServed": {"@type":"Country","name":"India"},
      "serviceType": ["Digital Marketing","Social Media Management","Reels and Video Production","Product Photography","Website Development","Creative Design"],
      "address": {"@type":"PostalAddress","streetAddress":"Dauhrra Mafi","addressLocality":"Aligarh","addressRegion":"Uttar Pradesh","addressCountry":"IN"}
    }
    </script>
    <script>
      (() => {
        const nativeFetch = window.fetch.bind(window);
        window.fetch = async (input, init) => {
          const url = typeof input === 'string' ? input : input instanceof Request ? input.url : String(input);
          const response = await nativeFetch(input, init);

          if (url === '/api/lead' && init?.method?.toUpperCase() === 'POST' && response.ok) {
            try {
              const result = await response.clone().json();
              if (result?.ok && result?.web3formsAccessKey && typeof init.body === 'string') {
                const lead = JSON.parse(init.body);
                const mailPayload = {
                  access_key: result.web3formsAccessKey,
                  subject: `Nexa Loops Lead | ${lead.service || 'Website Enquiry'} | ${lead.fullName || 'New Lead'}`,
                  from_name: 'Nexa Loops Website',
                  name: lead.fullName || '',
                  phone: lead.phoneNumber || '',
                  email: lead.email || '',
                  brand: lead.brandName || '',
                  service: lead.service || '',
                  budget: lead.budgetRange || '',
                  timeline: lead.startTime || '',
                  ticket_id: result.submissionId || '',
                  message: lead.message || '',
                  website_source: 'Nexa Loops Website'
                };

                nativeFetch('https://api.web3forms.com/submit', {
                  method: 'POST',
                  headers: {'Content-Type':'application/json','Accept':'application/json'},
                  body: JSON.stringify(mailPayload)
                }).then(async (mailResponse) => {
                  const mailResult = await mailResponse.json().catch(() => null);
                  if (!mailResponse.ok || !mailResult?.success) console.warn('Web3Forms notification was not delivered.');
                }).catch(() => console.warn('Web3Forms notification request failed.'));
              }
            } catch {
              // The enquiry is already safely stored in Supabase; email notification is secondary.
            }
          }

          return response;
        };
      })();
    </script>
